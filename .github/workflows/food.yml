# Food overlay CI (Guide §7.4). Paths are relative to the Aparajeyo_Bangla repository root.
# Not here yet: the `directus` job (Phase 2, slices 2.10-2.15) and the `e2e` job (it needs
# docker-compose.ci.yml, the perf dataset and the k6 scripts, which do not exist yet).
name: food
on:
  pull_request:
    paths: ["src/features/food/**", ".github/workflows/food.yml"]
  push:
    branches: [main]
  schedule:
    - cron: "0 20 * * *" # 02:00 BST nightly: flake gate
  workflow_dispatch: # a manual run, which includes the flake gate
permissions:
  contents: read
  pull-requests: read # gitleaks-action lists the commits of a pull request
defaults:
  run:
    shell: bash # fails a pipeline when any command in it fails
    working-directory: src/features/food/api # TS jobs; the other jobs override this

jobs:
  boundary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Food PRs touch only src/features/food/**
        working-directory: .
        env:
          BASE_REF: ${{ github.base_ref || 'main' }} # never pasted into the script itself
        run: bash src/features/food/scripts/check-boundary.sh "origin/$BASE_REF"

  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Santosh-Redemption/Documentaion
          path: _contract
          # A private contract repository needs a token that can read it.
          token: ${{ secrets.CONTRACT_REPO_TOKEN || github.token }}
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.4" }
      # contract/ and testdata/ resolve their packages from the feature root, the API from api/.
      - run: bun install --frozen-lockfile
        working-directory: src/features/food
      - run: bun install --frozen-lockfile
      - run: CONTRACT_DIR="$GITHUB_WORKSPACE/_contract/contracts/food_map" bun run contract:check
      - run: bun run gen:enums -- --check
      - run: bun run typecheck
      - run: bun run test:types

  api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.4" }
      - run: bun install --frozen-lockfile
        working-directory: src/features/food
      - run: bun install --frozen-lockfile
      - run: bun run test:unit
      - run: bun run test:integration # testcontainers
      # test-migrations.sh runs the dbmate command itself. The other jobs reach dbmate only through
      # the npm package's resolveBinary(), at the version in api/bun.lock. Keep the two equal.
      - name: Install dbmate 2.38.2
        run: |
          curl -fsSL -o "$RUNNER_TEMP/dbmate" https://github.com/amacneil/dbmate/releases/download/v2.38.2/dbmate-linux-amd64
          echo "4c6059e4e52558605d39e8c8075f3b15f96cac293043c0c71bb464d8950f235c  $RUNNER_TEMP/dbmate" | sha256sum -c -
          sudo install -m 755 "$RUNNER_TEMP/dbmate" /usr/local/bin/dbmate
      - run: bun run test:migrations # up, rollback, up on a fresh container
        env:
          # By path: `bun run` puts the npm package's dbmate ahead of this one on PATH.
          DBMATE: /usr/local/bin/dbmate

  # Slice 1.2: the same integration suite against the compose services.
  harness-compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.4" }
      - run: bun install --frozen-lockfile
        working-directory: src/features/food
      - run: bun install --frozen-lockfile
      - run: docker compose -f docker-compose.test.yml up -d --wait
        working-directory: src/features/food
      - run: FOOD_TEST_USE_COMPOSE=1 bun run test:integration

  workers:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src/features/food/workers
    env: # the services of docker-compose.test.yml
      DATABASE_URL_OWNER: postgresql://food@127.0.0.1:55432/postgres
      VALKEY_URL: redis://127.0.0.1:56379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y osm2pgsql
      - run: docker compose -f docker-compose.test.yml up -d --wait
        working-directory: src/features/food
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # food_hatchet joins this list when Phase 3 adds the package.
      - run: uv run mypy --strict food_shared food_poi_import food_photo_sync food_youtube_index food_video_match food_cache_warm
      - run: uv run pytest -m "unit or integration" --maxfail=1 -q

  compliance:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src/features/food
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # gitleaks reads history
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: bash scripts/compliance-grep.sh # Appendix F.4
      - run: bash scripts/tests/compliance-grep.test.sh
      - run: bash scripts/tests/check-boundary.test.sh
      - run: bash scripts/tests/flake-gate.test.sh
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Slice 1.11: ten consecutive green runs of both integration suites, with no retries.
  flake-gate:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DATABASE_URL_OWNER: postgresql://food@127.0.0.1:55432/postgres
      VALKEY_URL: redis://127.0.0.1:56379/0
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.4" }
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y osm2pgsql
      - run: bun install --frozen-lockfile
        working-directory: src/features/food
      - run: bun install --frozen-lockfile
      - run: uv sync --frozen
        working-directory: src/features/food/workers
      - run: docker compose -f docker-compose.test.yml up -d --wait # for the Python suite
        working-directory: src/features/food
      - run: bash ../scripts/flake-gate.sh 10 bun run test:integration
      - run: bash ../scripts/flake-gate.sh 10 uv run pytest -m "integration" -q
        working-directory: src/features/food/workers
