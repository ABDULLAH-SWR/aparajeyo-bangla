# Secrets have no defaults: compose fails closed. Generate .env.local with scripts/dev-up.sh.
services:
  postgres:
    image: postgis/postgis:17-3.5
    container_name: ${FOOD_CONTAINER_PREFIX:-aparajeyo-food}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-food}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:-aparajeyo_food}
    ports:
      - "${FOOD_PG_PORT:-5433}:5432"
    volumes:
      - food_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-food} -d ${POSTGRES_DB:-aparajeyo_food}"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8.1-alpine
    container_name: ${FOOD_CONTAINER_PREFIX:-aparajeyo-food}-valkey
    restart: unless-stopped
    ports:
      - "${FOOD_VALKEY_PORT:-6382}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  garage:
    image: dxflrs/garage:v1.0.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FOOD_S3_PORT:-3900}:3900"
      - "127.0.0.1:${FOOD_GARAGE_ADMIN_PORT:-3903}:3903"
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?required}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?required}
    configs:
      - source: garage_toml
        target: /etc/garage.toml
    volumes:
      - food_garage_meta:/var/lib/garage/meta
      - food_garage_data:/var/lib/garage/data

  imgproxy:
    image: darthsim/imgproxy:v4.0.25@sha256:cad8bfc8031d75efaeab622454f62a3e10dd1fe3a21056d40ab67aed812388cb
    restart: unless-stopped
    depends_on:
      - garage
    ports:
      - "127.0.0.1:${FOOD_IMGPROXY_PORT:-8081}:8080"
    environment:
      IMGPROXY_KEY: ${IMGPROXY_KEY:?required}
      IMGPROXY_SALT: ${IMGPROXY_SALT:?required}
      IMGPROXY_USE_S3: "true"
      IMGPROXY_S3_ENDPOINT: "http://garage:3900"
      IMGPROXY_S3_REGION: ${S3_REGION:?required}
      AWS_ACCESS_KEY_ID: ${S3_IMGPROXY_ACCESS_KEY:?required} # the read-only food-imgproxy key
      AWS_SECRET_ACCESS_KEY: ${S3_IMGPROXY_SECRET_KEY:?required}
      IMGPROXY_AUTO_WEBP: "true"
      IMGPROXY_AUTO_AVIF: "true"
      IMGPROXY_ALLOWED_SOURCES: s3://food-media/
      IMGPROXY_MAX_SRC_RESOLUTION: "50"
      IMGPROXY_MAX_SRC_FILE_SIZE: "10485760" # PHOTO_MAX_BYTES of the workers
      IMGPROXY_FAIL_ON_DEPRECATION: "true" # a renamed setting must not be silently ignored

  food-api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      default: {}
      food_internal:
        ipv4_address: ${FOOD_INTERNAL_PREFIX:-172.30.0}.10
    ports:
      - "127.0.0.1:${FOOD_API_PORT:-8002}:8002" # 8003, the internal listener, is never published
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://food_api:${FOOD_API_DB_PASSWORD:?required}@postgres:5432/${POSTGRES_DB:-aparajeyo_food}
      VALKEY_URL: redis://valkey:6379/0
      # The URL browsers use, not a container address: it is written into the responses.
      IMGPROXY_BASE_URL: ${IMGPROXY_BASE_URL:-http://127.0.0.1:8081}
      IMGPROXY_KEY: ${IMGPROXY_KEY:?required}
      IMGPROXY_SALT: ${IMGPROXY_SALT:?required}
      S3_BUCKET: food-media # no S3 credentials: the API only signs URLs
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      FOOD_INTERNAL_BIND_ADDR: ${FOOD_INTERNAL_PREFIX:-172.30.0}.10
      FOOD_INVALIDATE_TOKEN: ${FOOD_INVALIDATE_TOKEN:?required}
      GEO_CODES_PATH: data/geo_codes.v03.json

  directus:
    # Version 11, not 12: without a licence key, 12 refuses every custom permission rule, which the
    # Food Editor policy needs. directus/snapshot.yaml must be re-exported when this version changes.
    image: directus/directus:11.17.4@sha256:eb326f679ae847c0a776f93b972761dc2ebe84980e0b9d274a6bc31cd62809f7
    container_name: ${FOOD_CONTAINER_PREFIX:-aparajeyo-food}-directus
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - default
      - food_internal
    ports:
      - "127.0.0.1:${FOOD_DIRECTUS_PORT:-8055}:8055"
    volumes:
      - ./directus:/directus/food:ro # the committed schema snapshot
    environment:
      SECRET: ${DIRECTUS_SECRET:?required}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:?required}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:?required}
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-aparajeyo_food}
      # Never the owner: directus_food has column-scoped UPDATE and no DDL on public (migration 0012).
      DB_USER: directus_food
      DB_PASSWORD: ${DIRECTUS_DB_PASSWORD:?required}
      DB_SEARCH_PATH: directus,public # its system tables live in the directus schema
      # Tables no editor works with. spatial_ref_sys belongs to PostGIS.
      DB_EXCLUDE_TABLES: spatial_ref_sys,schema_migrations,sync_runs,food_import_rejects
      CACHE_ENABLED: "true"
      CACHE_STORE: redis
      # DB 0 holds the Food keys. Some Directus keys ignore the namespace, so the database differs too.
      REDIS: "redis://valkey:6379/1"
      CACHE_NAMESPACE: directus
      WEBSOCKETS_ENABLED: "false"
      # The Flow that directus-bootstrap.ts creates sends this token to the API's internal listener.
      FOOD_INVALIDATE_TOKEN: ${FOOD_INVALIDATE_TOKEN:?required}
      FLOWS_ENV_ALLOW_LIST: FOOD_INVALIDATE_TOKEN

networks:
  # Carries the invalidation call from Directus to the API. internal: no route off the host.
  food_internal:
    internal: true
    ipam:
      config:
        - subnet: ${FOOD_INTERNAL_PREFIX:-172.30.0}.0/24

# Garage's configuration is inline so that Compose fills in S3_REGION: Garage cannot read it from the
# environment.
configs:
  garage_toml:
    content: |
      metadata_dir = "/var/lib/garage/meta"
      data_dir = "/var/lib/garage/data"
      db_engine = "lmdb"
      replication_factor = 1

      rpc_bind_addr = "[::]:3901"
      rpc_public_addr = "127.0.0.1:3901"
      # rpc_secret and admin_token come from GARAGE_RPC_SECRET / GARAGE_ADMIN_TOKEN.

      [s3_api]
      s3_region = "${S3_REGION:?required}"
      api_bind_addr = "[::]:3900"
      root_domain = ".s3.garage.localhost"

      [admin]
      api_bind_addr = "[::]:3903"

volumes:
  food_pgdata:
  food_garage_meta:
  food_garage_data:
