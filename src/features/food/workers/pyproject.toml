[project]
name = "aparajeyo-food-workers"
version = "0.1.0"
description = "Food overlay Python workers (OSM, Overture, Wikimedia, YouTube, Valkey cache)"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.35.0",
  "httpx>=0.28.0",
  "normalizer @ git+https://github.com/csebuetnlp/normalizer",
  "overturemaps>=2.1.1",
  "psycopg[binary]>=3.2.0",
  "pyarrow>=18.0.0",
  "pyyaml>=6.0.2",
  "shapely>=2.0.6",
  "valkey>=6.0.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
# pytest assertions are plain asserts.
"tests/**" = ["S101"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "unit: no services",
  "integration: needs PostGIS (DATABASE_URL_OWNER), Valkey (VALKEY_URL) and osm2pgsql",
  "e2e: needs the running stack, including the API",
  "golden: golden-set evaluation (Phase 3)",
]

[tool.mypy]
# Modules are imported from this directory (`food_shared.db`), the same root pytest uses.
explicit_package_bases = true
# Integration tests import their sibling helper as `importing`, as pytest puts that directory on
# sys.path.
mypy_path = "$MYPY_CONFIG_FILE_DIR/tests/integration"
# valkey.from_url ships without annotations.
untyped_calls_exclude = ["valkey"]

[[tool.mypy.overrides]]
# Third-party packages without type information.
module = [
  "boto3.*",
  "botocore.*",
  "normalizer.*",
  "overturemaps.*",
  "pyarrow.*",
  "shapely.*",
  "yaml.*",
]
ignore_missing_imports = true

[project.scripts]
food-poi-import          = "food_poi_import.run:main"
food-cache-warm          = "food_cache_warm.warm:main"
food-photo-purge-nonfree = "food_photo_sync.purge:main"
food-photo-sync          = "food_photo_sync.sync:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["food_cache_warm", "food_photo_sync", "food_poi_import", "food_video_match", "food_youtube_index", "food_shared"]
